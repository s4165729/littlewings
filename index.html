<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Little Wings - collect the clouds</title>
    <meta
    name="description"
    content="Fly a little plane to find six hidden clodus, each one sings 
    its own note, and together they make a song">

    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet">

    <!--connect to style css file-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--where the sky, clouds, stars and plane are drawn-->
    <canvas
    id="stage"
    role="img"
    aria-label="A sky with six sleepy clouds, fly the little wings plane to a cloud to wake it up and it will sing"
    ></canvas>

    <!-- welcome screen shown when the game first opens-->
    <section
    id="intro"
    class="intro"
    aria-labelledby="title"
    >
    <h1 id="title">Little Wings</h1>
    <p class="sub">Collect the clouds</p>

    <!--Button that will start the game-->
    <button
    id="play"
    class="play"
    type="button"
    aria-label="start the game"
    >
    <svg viewBow="0 0 24 24" aria-hidden="true">
        <path d="M7 4.5v15a1 0 0 0 1.5.86l12.4-55a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/>
        </svg>
    <span>Let's fly!</span>
</button>
</section>

<!--Button that lets the player play again after the game-->
<button
id="again"
class="again"
type="button"
hidden
>

<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
    <path d="M20 4v5h-5"/>
</svg>
Again!
</button>

<!--settings button panel -->
<button
id="gear"
class="gear"
type="button"
aria-label="Grown-up settings"
aria-expanded="false"
aria-controls="panel"
>
<svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 512 2 M17 1712 2 M19 51-2 2 M5 1912-2"/>
</svg>
</button>

<!--Settings panel-->
<div id="panel" class="panel" hidden>
    <h2>For grown-ups</h2>

<!--Turn sound on or off-->
<div class="row">
    <span>Sound</span>

    <button
    id="soundBtn"
    class="chip"
    type="button"
    aria-pressed="true"
    >
    On
</button>
</div>

<!--Adjust the volume-->
<div class="row">
    <label for="volume">Volume</label>
<input
id="volume"
type="range"
min="0"
max="1"
step="0.05"
value="0.7"
>
</div>

<!--Choose the musical scale-->
<div>
    <h2>Scale</h2>
    <div class="scale">
        <button
        class="chip active"
        type="button"
        data-scale="pentatonic"
        >
        Pentationic
    </button>

    <button
    class="chip"
    type="button"
    data-scale="major"
    >
    Major
</button>

<button
class="chip"
type="button"
data-scale="minor"
>
Minor
</button>

<button
class="chip"
type="button"
data-scale="dorian"
>
Dorian
</button>

<button
class="chip"
type="button"
data-scale="dreamy"
>
Dreamy
</button>
</div>
</div>

<!--reset the saved star count-->
<div class="row">
    <span>Stars collected</span>

    <button
    id="clearStars"
    class="chip"
    type="button"
>
Reset
</button>
</div>

<!--start a new game restart again-->
<div class="row">
    <span>New sky</span>

    <button
    id="restart"
    class="chip"
    type="button"
>
Start over
</button>
</div>
</div>

<!--Screen announcements-->
<p id="status" class="sr" aria-live="polite"></p>

<!--connect to the java script file-->
<script src="script.js" defer></script>
</body>
</html>
