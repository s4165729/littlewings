<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Little Wings - collect the clouds</title>
    <meta
    name="description"
    content="Fly a little plane to find six hidden clodus, each one sings 
    its own note, and together they make a song">

    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet">

    <!--connect to style css file-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!--the sky everything user will fly in-->
<div id="sky" class="sky" role="img"
aria-label="A sky with eight sleepy clouds, fly the little plane close to a cloud to wake it it up and it sing">
<div class="sunrise"></div> <!--sunrise clouurs that will fade in when win all stars-->
<div class="glow"></div> <!--purple glow at bottom edge-->
<div class="sun"></div> <!--rises when you win all stars as a sign the sky is lit up-->
<div id="dust"></div> <!--tiny floating dots, will add in js-->

<div id="stars" class="stars"></div> <!-- row of eight stars at the top-->
<!--the plane is a picture style.css will move it i think, and flip it and tilt it so 
it seems like it is flying-->
<img id="plane" class="plane" src="images/plane.png" alt=""></div>

<p id="status" class="sr" aria-live="polite"></p>
<!--five point stars shapes- the flying ones when someone wins and the sparkles use it-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star" viewBox="0 0 24 24">
        <polygon points="12, 0 15.2,7.5 23.4,8.3 17.2,13.7 19.1,21.7,17.5 4.9, 21.7, 6.8,13.7 0.6,8.3 8.8,7.5"/>
    </symbol>
</svg>

<!--one cloud each cloud in the game is a copy of this-->
<template id="cloudTemplate">
 <div class="cloud">
    <div class="halo"></div>
    <img class="puffs" src="images/cloud.png" alt="">
    <b class="letter"></b>
    <svg class="ring" viewBox="-50 -50 100 100" aria-hidden="true">
        <circle class="progress" r="45" pathLength="1"/>
        <circle class="hint" r="45"/>
    </svg>
 </div>  
</template>

<!--buttons and settings :)-->
<!-- welcome screen-->
 <section id="intro" class="intro" aria-labelledy="title">
    <h1 id="title">Little Wings</h1>
    <p class="sub">Collect the clouds</p>
    <button id="play" class="play" type="button" aria-label="start the game">
    <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.2-6.86a1 1 0 0 0 0-1.72L9.5 4.28A1 1 0 0 0 8 5.14z"/>
 </svg>
 <span>Lets fly!</span>
</button>
</section>

<!--play again button until every start completed and cloud gotten-->
<button id="again" class="again" type="button" hidden>↩︎ Again!</button>

<!-- settings gear-->
 <button id="gear" class="gear" type="button" aria-label="Grown-up settings"
 aria-expanded="false" aria-controls="panel">⚙︎</button>

 <!--settings panel when click on button-->
 <div id="panel" class="panel" hidden>
    <h2>Settings</h2>
 
    <div class="row">
        <span>Sound</span>
        <button id="soundBtn" class="chip" type="button" aria-pressed="true">On</button>
    </div>

    <div class="row">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7">
    </div>

    <div>
    
    </div>
    <h2>Scale</h2>
    <div class="scales">
        <button class="chip active" type="button" data-scale="pentatonic">Pentationic</button>
        <button class="chip" type="button" data-scale="major">Major</button>
        <button class="chip" type="button" data-scale="minor">Minor</button>
        <button class="chip" type="button" data-scale="dorian">Dorian</button>
        <button class="chip" type="button" data-scale="dreamy">Dreamy</button>
    </div>

<div class="row">
    <span>This round</span>
    <button id="restart" class="chip" type="button">Restart</button>
</div>

<div class="row">
    <span>Stars collected</span>
    <button id="clearStars" class="chip" type="button">Start over</button>
</div>
</div>

<!--tone js makes the sound and the cloud notes and pianooo-->
<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
<script src="script.js"></script>
</body>
</html>
