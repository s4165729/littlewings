<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Little Wings - collect the clouds</title>
    <meta
    name="description"
    content="Fly a little plane to find six hidden clodus, each one sings 
    its own note, and together they make a song">

    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet">

    <!--connect to style css file-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--where the sky, clouds, stars and plane are drawn-->
    <canvas
    id="stage"
    role="img"
    aria-label="A sky with six sleepy clouds, fly the little wings plane to a cloud to wake it up and it will sing"
    ></canvas>

    <!-- welcome screen shown when the game first opens-->
    <section
    id="intro"
    class="intro"
    aria-labelledby="title"
    >
    <h1 id="title">Little Wings</h1>
    <p class="sub">Collect the clouds</p>

    <!--Button that will start the game-->
    <button
    id="play"

</section>
</body>

</html>
